[package]
name = "serial_mcp_tui"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui", "mcp"]
# WinAPI GUI：仅使用系统窗口/RichEdit；ratatui 仅复用已验证的 ANSI 文本解析数据类型。
gui = ["dep:windows-sys", "dep:ratatui"]
# TUI 界面（人工输入 + 日志视图），面向 Windows Terminal
tui = ["dep:ratatui", "ratatui/crossterm", "dep:crossterm"]
# MCP server（streamable HTTP，走独立端口，不与 TUI 抢终端）
mcp = [
    "dep:axum",
    "rmcp/server",
    "rmcp/macros",
    "rmcp/schemars",
    "rmcp/transport-streamable-http-server",
]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["std"] }
rmcp = { version = "3.8.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serial2 = "0.2.39"
tokio = { version = "1.54.1", features = ["full"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum = { version = "0.8", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
